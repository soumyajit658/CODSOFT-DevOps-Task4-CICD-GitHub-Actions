<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
            padding-top: 120px;
        }

        h1 {
            font-size: 80px;
            color: #22c55e;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 32px;
        }

        p {
            color: #cbd5e1;
            font-size: 18px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #22c55e;
            color: #0f172a;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>404</h1>
    <h2>Page Not Found</h2>

    <p>The page you are looking for does not exist.</p>

    <a href="/">Return to Home</a>

</body>
</html>
